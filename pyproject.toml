[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glaivio-ai"
version = "0.3.15"
description = "The opinionated framework for AI-native apps"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "python-multipart",
    "twilio",
    "click",
    "langchain",
    "langchain-anthropic",
    "langgraph",
    "psycopg2-binary",
    "langgraph-checkpoint-postgres",
    "psycopg[binary]",
    "pytz",
    "pyyaml",
]

[project.scripts]
glaivio = "glaivio.cli:cli"

[project.optional-dependencies]
postgres = ["langgraph-checkpoint-postgres", "psycopg[binary]", "psycopg2-binary"]
privacy = ["presidio-analyzer", "presidio-anonymizer", "spacy"]
knowledge = ["chromadb", "langchain-chroma", "sentence-transformers", "pypdf", "unstructured"]
gmail = ["google-auth-oauthlib", "google-auth-httplib2", "google-api-python-client"]
gemini = ["langchain-google-genai"]
openai = ["langchain-openai"]
ollama = ["langchain-ollama"]
all = [
    "langgraph-checkpoint-postgres",
    "psycopg[binary]",
    "langchain-google-genai",
    "langchain-openai",
    "langchain-ollama",
]

[project.urls]
Homepage = "https://github.com/tavyy/glaivio-ai"
Repository = "https://github.com/tavyy/glaivio-ai"
